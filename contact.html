<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contact-container">
        <h2 class="form-title">Got a question? 👀</h2>
        <p class="form-intro">Lost something? Found something? Let's sort it out.</p>
    </div>

    <div class="contact-cards">
        <div class="contact-card">
            <h3>💌 Email Us</h3>
            <p>campuslostfound@example.com</p>
        </div>
        <div class="contact-card">
            <h3>📍 Find Us</h3>
            <p>Campus Administration Office</p>
        </div>
        <div class="contact-card">
            <h3>☎️ Need Quick Help?</h3>
            <p>+91 817844XXXX</p>
        </div>
        <div class="message-box">
            <h3>Send us a message 💬</h3>
            <p class="contact-note">No stress, we'll get back to you soon ✨</p>
            <input type="text" placeholder="Your name">
            <input type="email" placeholder="Your email">
            <textarea placeholder="What's on your mind?"></textarea>
            <button type="button">Send Message</button>
        </div>
        <div class="contact-footer">
            <p>Made for the campus community 💜</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
