<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="report-page">
    <h2 class="form-title">Report a Found Item</h2>
    <p class="form-intro">
        Please provide as much information as possible about the item you found.
    </p>
    <form class="found-form">
        <div>
            <label>Item Name</label>
            <input type="text" placeholder="e.g. Water Bottle" required>
        </div>
        <div>
            <label>Category</label>
            <input type="text" placeholder="e.g. Bottle" required>
        </div>

        <div>
            <label>Item Color</label>
            <input type="text" placeholder="e.g. Black, Blue" required>
        </div>

        <div>
            <label>Date Found</label>
            <input type="date" required>
        </div>

        <div>
            <label>Location</label>
            <input type="text" placeholder="e.g. Library, Cafeteria" required>
        </div>

        <div>
            <label>Item Image</label>
            <input type="file" id="foundItemImage" accept="image/*" required>
        </div>
        
        <div>
            <label>Description</label>
            <textarea placeholder="e.g. Black water bottle with a small sticker" required></textarea>
        </div>
        <div>
            <label>Contact Information</label>
            <input type="text" placeholder="e.g. 987654XXXX" required>
        </div>
        <button type="submit">Submit Report</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
