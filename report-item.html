<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="report-page">
    <h2 class="form-title">Report an Item</h2>
    <p class="form-intro">
        Choose whether you want to report a lost or found item.
    </p>
    <div class="report-options">
        <div class="report-card">
            <div class="report-icon">🔍</div>
            <h3>Lost Something?</h3>
            <p>Tell us what you lost and where you last saw it.</p>
            <a href="report-lost.html">Report Lost</a>
        </div>
        <div class="report-card">
            <div class="report-icon">🤝</div>
            <h3>Found Something?</h3>
            <p>Help someone get their lost item back.</p>
            <a href="report-found.html">Report Found</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
